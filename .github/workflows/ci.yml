name: Combined CI

on: [push, pull_request]

jobs:
  linux:
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:gnome-44
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Setup Packages
        run: |
          flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install org.kde.Sdk//6.8 org.kde.Platform//6.8 -y
          dnf install libusb1-devel cmake rust cargo git gcc-c++ libXext-devel libgudev qt6-qtbase-devel systemd-devel \
            openal-soft-devel libevdev-devel libao-devel SOIL-devel libXrandr-devel SDL3-devel pulseaudio-libs-devel \
            bluez-libs-devel p7zip SDL2-devel SDL2_net -y
      - name: Run Flatpak Builder
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: Package/flatpak.yml
          bundle: MupenMPN-linux.flatpak

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: Windows
      - uses: msys2/setup-msys2@v2
        with:
          path-type: inherit
          update: true
          install: >-
            make
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-hidapi
            mingw-w64-x86_64-freetype
            mingw-w64-x86_64-libpng
            mingw-w64-x86_64-qt6
            mingw-w64-x86_64-sdl3
            mingw-w64-x86_64-hidapi
            mingw-w64-x86_64-speexdsp
            mingw-w64-x86_64-libsamplerate
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-minizip
            git
      - name: Verify submodules
        run: |
          echo "Checking SDL3_net directory..."
          ls -la Source/3rdParty/SDL3_net/
          echo "Checking for CMakeLists.txt..."
          ls -la Source/3rdParty/SDL3_net/CMakeLists.txt
        shell: msys2 {0}
      - name: Build RMG
        run: ./Source/Script/Build.sh Release
        shell: msys2 {0}
      - name: Upload RMG
        uses: actions/upload-artifact@v4
        with:
          name: MupenMPN-win32
          path: Bin/Release/*
