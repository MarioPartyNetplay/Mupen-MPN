name: Mupen CLI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest

    container:
      image: bilelmoussaoui/flatpak-github-actions:gnome-46
      options: --privileged

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Flatpak
        run: |
          flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

          flatpak install -y flathub \
            org.kde.Sdk//6.8 \
            org.kde.Platform//6.8

      - name: Install Build Dependencies
        run: |
          dnf install -y \
            cmake \
            ninja-build \
            rust \
            cargo \
            git \
            gcc-c++ \
            libusb1-devel \
            libXext-devel \
            libgudev-devel \
            qt6-qtbase-devel \
            qt6-qttools-devel \
            systemd-devel \
            openal-soft-devel \
            libevdev-devel \
            libao-devel \
            SOIL-devel \
            libXrandr-devel \
            SDL3-devel \
            SDL2-devel \
            SDL2_net \
            pulseaudio-libs-devel \
            bluez-libs-devel \
            p7zip

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: Package/flatpak.yml
          bundle: MupenMPN-linux.flatpak
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MupenMPN-linux
          path: MupenMPN-linux.flatpak

  windows:
    runs-on: windows-2022

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: windows-msys2

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          path-type: inherit
          update: true
          install: >-
            make
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt6
            mingw-w64-x86_64-sdl3
            mingw-w64-x86_64-hidapi
            mingw-w64-x86_64-freetype
            mingw-w64-x86_64-libpng
            mingw-w64-x86_64-speexdsp
            mingw-w64-x86_64-libsamplerate
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-minizip
            mingw-w64-x86_64-libsrtp
            mingw-w64-x86_64-libusb

      - name: Build RMG
        shell: msys2 {0}
        run: |
          chmod +x ./Source/Script/Build.sh
          ./Source/Script/Build.sh Release

      - name: Upload Windows Artifact (Folder Build)
        uses: actions/upload-artifact@v4
        with:
          name: MupenMPN-win32
          path: Bin/Release/*

      - name: Install Enigma Virtual Box
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://enigmaprotector.com/assets/files/enigmavb.exe" `
            -OutFile enigmavb.exe

          Start-Process -FilePath .\enigmavb.exe -ArgumentList "/S" -Wait

      - name: Create Portable Single EXE
        shell: msys2 {0}
        run: |
          echo "Packaging with Enigma Virtual Box..."
          mkdir -p Bin/Release/Flat
          EXE_NAME="MupenMPN.exe"
          INPUT="Bin/Release/$EXE_NAME"
          OUTPUT="Bin/Release/Flat/MupenMPN.exe"
          enigmavbconsole Package/MupenMPN.evb

      - name: Upload Windows Artifact (Portable EXE)
        uses: actions/upload-artifact@v4
        with:
          name: MupenMPN-win32-portable
          path: Bin/Release/Flat/