name: Mupen CLI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest

    container:
      image: bilelmoussaoui/flatpak-github-actions:gnome-46
      options: --privileged

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Initialize submodules
        run: |
          git submodule update --init --depth 1 Source/3rdParty/libdatachannel
          git -C Source/3rdParty/libdatachannel submodule update --init --depth 1 --recursive

      - name: Setup Flatpak
        run: |
          flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

          flatpak install -y flathub \
            org.kde.Sdk//6.8 \
            org.kde.Platform//6.8

      - name: Install Build Dependencies
        run: |
          dnf install -y \
            cmake \
            pkgconf-pkg-config \
            ninja-build \
            rust \
            cargo \
            git \
            gcc-c++ \
            libusb1-devel \
            libXext-devel \
            libgudev-devel \
            qt6-qtbase-devel \
            qt6-qttools-devel \
            systemd-devel \
            openal-soft-devel \
            libevdev-devel \
            libao-devel \
            SOIL-devel \
            libXrandr-devel \
            SDL3-devel \
            SDL2_net \
            pulseaudio-libs-devel \
            bluez-libs-devel \
            p7zip

      - name: Verify SDL3 pkg-config
        run: |
          pkg-config --modversion sdl3

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: Package/flatpak.yml
          bundle: MupenMPN-linux.flatpak
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MupenMPN-linux
          path: MupenMPN-linux.flatpak

  windows:
    runs-on: windows-2022

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Initialize submodules
        run: |
          git submodule update --init --depth 1 Source/3rdParty/libdatachannel
          git -C Source/3rdParty/libdatachannel submodule update --init --depth 1 --recursive

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: windows-msys2

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          path-type: inherit
          update: true
          install: >-
            make
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-tools
            mingw-w64-x86_64-qt6-declarative
            mingw-w64-x86_64-qt6-multimedia
            mingw-w64-x86_64-qt6-svg
            mingw-w64-x86_64-qt6-imageformats
            mingw-w64-x86_64-qt6-websockets
            mingw-w64-x86_64-qt6-networkauth
            mingw-w64-x86_64-qt6-serialport
            mingw-w64-x86_64-sdl3
            mingw-w64-x86_64-hidapi
            mingw-w64-x86_64-freetype
            mingw-w64-x86_64-libpng
            mingw-w64-x86_64-speexdsp
            mingw-w64-x86_64-libsamplerate
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-minizip
            mingw-w64-x86_64-libsrtp
            mingw-w64-x86_64-libusb

      - name: Build RMG
        shell: msys2 {0}
        run: |
          chmod +x ./Source/Script/Build.sh
          ./Source/Script/Build.sh Release

      - name: Upload Windows Artifact (Folder Build)
        uses: actions/upload-artifact@v4
        with:
          name: MupenMPN-windows-x86_64
          path: Bin/Release/*

  macos:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Initialize submodules
        run: |
          git submodule update --init --depth 1 \
            Source/3rdParty/libdatachannel \
            Source/3rdParty/angle \
            Source/3rdParty/angle-cmake
          git -C Source/3rdParty/libdatachannel submodule update --init --depth 1 --recursive

      - name: Install Rosetta 2
        run: softwareupdate --install-rosetta --agree-to-license

      - name: Install x86_64 Homebrew
        run: |
          if [[ ! -x /usr/local/bin/brew ]]; then
            NONINTERACTIVE=1 arch -x86_64 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          fi
          {
            echo 'HOMEBREW_PREFIX=/usr/local'
            echo 'HOMEBREW_CELLAR=/usr/local/Cellar'
            echo 'HOMEBREW_REPOSITORY=/usr/local/Homebrew'
          } >> "$GITHUB_ENV"
          echo '/usr/local/bin' >> "$GITHUB_PATH"
          echo '/usr/local/sbin' >> "$GITHUB_PATH"

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: macos-rosetta-x86_64
          install: yes

      - name: Install Build Dependencies
        run: |
          arch -x86_64 /usr/local/bin/brew install cmake qt sdl3 nasm speexdsp libsamplerate minizip pkg-config openssl nlohmann-json srtp libusb libpng molten-vk vulkan-loader vulkan-headers

      - name: Build RMG (x86_64 for Rosetta)
        run: |
          chmod +x ./Source/Script/Build.sh
          arch -x86_64 env MPN_SKIP_ROSETTA_REEXEC=1 ./Source/Script/Build.sh Release

      - name: Upload macOS Artifact (Folder Build)
        uses: actions/upload-artifact@v4
        with:
          name: MupenMPN-macOS-x86_64
          path: Bin/Release/*