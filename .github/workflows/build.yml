name: Mupen CLI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest

    container:
      image: bilelmoussaoui/flatpak-github-actions:gnome-46
      options: --privileged

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          dnf install -y \
            cmake \
            pkgconf-pkg-config \
            ninja-build \
            rust \
            cargo \
            git \
            gcc-c++ \
            libusb1-devel \
            libXext-devel \
            libgudev-devel \
            qt6-qtbase-devel \
            qt6-qttools-devel \
            systemd-devel \
            openal-soft-devel \
            libevdev-devel \
            libao-devel \
            SOIL-devel \
            libXrandr-devel \
            SDL3-devel \
            SDL2_net \
            pulseaudio-libs-devel \
            bluez-libs-devel \
            p7zip \
            enet-devel \
            perl
            
      - name: Prepare Flatpak manifest for CI
        run: |
          perl -0pe 's/- type: git\r?\n        url: https:\/\/github.com\/MarioPartyNetplay\/Mupen-MPN.git\r?\n        disable-submodules: true/- type: dir\n        path: ../s' \
            Package/flatpak.yml > Package/flatpak-ci.yml

      - name: Setup Flatpak
        run: |
          flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

          flatpak install -y flathub \
            org.kde.Sdk//6.9 \
            org.kde.Platform//6.9

      - name: Verify SDL3 pkg-config
        run: |
          pkg-config --modversion sdl3

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: Package/flatpak-ci.yml
          bundle: MupenMPN-linux-x86_64.flatpak
          cache-key: flatpak-builder-${{ github.sha }}

  windows:
    runs-on: windows-2022

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Initialize submodules
        run: |
          git submodule update --init --depth 1 Source/3rdParty/libdatachannel
          git -C Source/3rdParty/libdatachannel submodule update --init --depth 1 --recursive

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: windows-msys2

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          path-type: inherit
          update: true
          install: >-
            make
            git
            mingw-w64-x86_64-enet
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-tools
            mingw-w64-x86_64-qt6-declarative
            mingw-w64-x86_64-qt6-multimedia
            mingw-w64-x86_64-qt6-svg
            mingw-w64-x86_64-qt6-imageformats
            mingw-w64-x86_64-qt6-websockets
            mingw-w64-x86_64-qt6-networkauth
            mingw-w64-x86_64-qt6-serialport
            mingw-w64-x86_64-sdl3
            mingw-w64-x86_64-hidapi
            mingw-w64-x86_64-freetype
            mingw-w64-x86_64-libpng
            mingw-w64-x86_64-speexdsp
            mingw-w64-x86_64-libsamplerate
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-minizip
            mingw-w64-x86_64-libsrtp
            mingw-w64-x86_64-libusb

      - name: Build RMG
        shell: msys2 {0}
        run: |
          chmod +x ./Source/Script/Build.sh
          ./Source/Script/Build.sh Release

      - name: Upload Windows Artifact (Folder Build)
        uses: actions/upload-artifact@v4
        with:
          name: MupenMPN-windows-x86_64
          path: Bin/Release/*

  macos:
    runs-on: macos-15-intel

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Initialize submodules
        run: |
          git submodule update --init --depth 1 \
            Source/3rdParty/libdatachannel \
            Source/3rdParty/angle
          git -C Source/3rdParty/libdatachannel submodule update --init --depth 1 --recursive

      - name: Install MacPorts
        run: |
          set -euo pipefail
          MP_VERSION=2.12.6
          curl -fsSL -o macports.pkg \
            "https://github.com/macports/macports-base/releases/download/v${MP_VERSION}/MacPorts-${MP_VERSION}-15-Sequoia.pkg"
          sudo installer -pkg macports.pkg -target /
          rm -f macports.pkg
          # Force Intel packages even if the runner process reports arm64.
          printf '\nbuild_arch x86_64\nui_interactive no\n' | sudo tee -a /opt/local/etc/macports/macports.conf
          echo "/opt/local/libexec/qt6/bin" >> "$GITHUB_PATH"
          echo "/opt/local/bin" >> "$GITHUB_PATH"
          echo "/opt/local/sbin" >> "$GITHUB_PATH"
          echo "PKG_CONFIG_PATH=/opt/local/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=/opt/local/libexec/qt6:/opt/local" >> "$GITHUB_ENV"
          echo "MPN_OSX_ARCH=x86_64" >> "$GITHUB_ENV"
          sudo /opt/local/bin/port -q selfupdate

      - name: Install ccache
        run: sudo /opt/local/bin/port -N install ccache

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: macos-15-intel-macports
          install: no

      - name: Install Build Dependencies
        run: |
          sudo /opt/local/bin/port -N install \
            cmake \
            nasm \
            pkgconfig \
            qt6-qtbase \
            qt6-qttools \
            qt6-qtsvg \
            qt6-qtimageformats \
            SDL3 \
            speexDSP \
            libsamplerate \
            minizip \
            openssl3 \
            nlohmann-json \
            libsrtp \
            libusb \
            libpng \
            MoltenVK \
            vulkan-loader \
            vulkan-headers \
            hidapi \
            libenet

      - name: Build RMG (x86_64)
        run: |
          chmod +x ./Source/Script/Build.sh
          ./Source/Script/Build.sh Release

      - name: Verify x86_64 binary
        run: |
          set -euo pipefail
          bin="Bin/Release/Mupen-MPN.app/Contents/MacOS/Mupen-MPN"
          test -f "$bin"
          archs="$(lipo -archs "$bin")"
          echo "Built architectures: $archs"
          echo "$archs" | grep -qw x86_64
          if echo "$archs" | grep -qw arm64; then
            echo "error: artifact contains arm64; Intel-only x86_64 is required" >&2
            exit 1
          fi

      - name: Prepare macOS Artifacts
        run: |
          cd Bin/Release
          hdiutil create -volname "Mupen-MPN" -srcfolder Mupen-MPN.app -ov -format UDZO MupenMPN-macOS-x86_64.dmg
          rm -rf Mupen-MPN.app

      - name: Upload macOS Artifact (Folder Build)
        uses: actions/upload-artifact@v4
        with:
          name: MupenMPN-macOS-x86_64
          path: Bin/Release/*
