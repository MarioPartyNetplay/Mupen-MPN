app-id: org.mariopartynetplay.RMG-MPN
runtime: org.kde.Platform
runtime-version: 6.9
sdk: org.kde.Sdk
add-build-extensions:
  org.freedesktop.Sdk.Extension.rust-stable:
    version: '24.08'
    remove-after-build: true
command: Mupen-MPN
finish-args:
  - --socket=x11
  - --socket=pulseaudio
  - --share=ipc
  - --share=network
  - --device=all
  - --filesystem=host
cleanup:
  - /lib/pkgconfig
  - /lib/*.la
  - /lib/*.a
  - /include
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/RMG/cargo

modules:
  - name: minizip
    subdir: contrib/minizip
    config-opts:
      - --disable-static
    sources:
      - type: git
        url: https://github.com/madler/zlib.git
        tag: v1.3.2
        commit: da607da739fa6047df13e66a2af6b8bec7c2a498
      - type: shell
        commands:
          - GLOBIGNORE=contrib && rm -rf *
          - GLOBIGNORE=contrib/minizip && rm -rf contrib/*
          - rm -f contrib/minizip/Makefile
          # zlib 1.3.2 ioapi.h includes ints.h, but Makefile.am omits it from
          # installed headers (madler/zlib#1164).
          - grep -q 'ints\.h' contrib/minizip/Makefile.am || sed -i '/crypt\.h \\/a\      ints.h \\' contrib/minizip/Makefile.am
          - autoreconf -fiv contrib/minizip

  - name: hidapi
    sources:
      - type: archive
        url: https://github.com/libusb/hidapi/archive/refs/tags/hidapi-0.14.0.tar.gz
        sha256: a5714234abe6e1f53647dd8cba7d69f65f71c558b7896ed218864ffcf405bcbd
        x-checker-data:
          type: anitya
          project-id: 5594
          stable-only: true
          url-template: https://github.com/libusb/hidapi/archive/refs/tags/hidapi-$version.tar.gz
    cleanup:
      - /share/doc
    modules:
      - name: libusb
        sources:
          - type: archive
            url: https://github.com/libusb/libusb/archive/refs/tags/v1.0.27.tar.gz
            sha256: e8f18a7a36ecbb11fb820bd71540350d8f61bcd9db0d2e8c18a6fb80b214a3de
            x-checker-data:
              type: anitya
              project-id: 1749
              stable-only: true
              url-template: https://github.com/libusb/libusb/archive/refs/tags/v$version.tar.gz

  - name: SDL3
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DSDL_SHARED=ON
      - -DSDL_STATIC=OFF
      - -DSDL_TEST=OFF
      - -DSDL_TESTS=OFF
    sources:
      - type: archive
        url: https://github.com/libsdl-org/SDL/releases/download/release-3.4.10/SDL3-3.4.10.tar.gz
        sha256: 12b34280415ec8418c864408b93d008a20a6530687ee613d60bfbd20411f2785

  - name: RMG-MPN
    buildsystem: cmake-ninja
    post-install:
      - desktop-file-edit --set-key=Exec --set-value='/app/bin/Mupen-MPN'
        /app/share/applications/com.github.Rosalie241.RMG-MPN.desktop
      - desktop-file-edit --set-key=Name --set-value='Mupen MPN'
        /app/share/applications/com.github.Rosalie241.RMG-MPN.desktop 
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DPORTABLE_INSTALL=OFF
      - -DDRAG_DROP=OFF
      - -DDISCORD_RPC=OFF
      - -DUSE_ANGRYLION=ON
    sources:
      - type: git
        url: https://github.com/MarioPartyNetplay/Mupen-MPN.git
        disable-submodules: true
      - type: git
        url: https://github.com/paullouisageneau/libdatachannel.git
        commit: 9ddf88971fcc7437b2bfeef92ba5454b7de067f8
        dest: Source/3rdParty/libdatachannel
      - type: archive
        url: https://github.com/lsalzman/enet/archive/refs/tags/v1.3.17.tar.gz
        sha256: 1e0b4bc0b7127a2d779dd7928f0b31830f5b3dcb7ec9588c5de70033e8d2434a
        strip-components: 1
        dest: Source/3rdParty/enet
      - type: shell
        commands:
          - git -C Source/3rdParty/libdatachannel submodule update --init --recursive
